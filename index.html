<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
<div class="overlay"></div>
<div class="login-container">
    <div class="login-card">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png" class="logo">
        <h1>Student Portal</h1>
        <p>Welcome back! Please login.</p>
        <input type="text" id="username" placeholder="Username" class="form-control mb-3">
        <input type="password" id="password" placeholder="Password" class="form-control mb-3">
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">
                Stay logged in
            </label>
        </div>
        <button onclick="login()" class="btn login-btn">
            Login
        </button>
        <p class="forgot">Forgot password?</p>
    </div>
</div>
<script src="proj.js"></script>
</body>
</html>
